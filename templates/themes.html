<script>
    // 主题文字颜色配置
    var themeTextColors = {
        'original': { primary: '#333', secondary: '#666' },
        'dark': { primary: '#e0e0e0', secondary: '#aaa' },
        'cyberpunk': { primary: '#00fff5', secondary: '#00fff5' },
        'matrix': { primary: '#00ff41', secondary: '#00ff41' },
        'persona5': { primary: '#ff1744', secondary: '#ff1744' },
        'persona3': { primary: '#4fc3f7', secondary: '#4fc3f7' },
        'persona4': { primary: '#FFD700', secondary: '#FFD700' }
    };

    // 更新卡片文字颜色
    function updateCardTextColors(theme) {
        var colors = themeTextColors[theme] || themeTextColors['original'];
        document.querySelectorAll('[data-theme]').forEach(function(card) {
            var titleEl = card.querySelector('.theme-card-title');
            var descEl = card.querySelector('.theme-card-desc');
            if (titleEl) {
                titleEl.style.color = colors.primary;
            }
            if (descEl) {
                descEl.style.color = colors.secondary;
            }
        });
    }

    // 监听iframe消息来切换主题
    window.addEventListener('message', function(e) {
        if (e.data && e.data.action === 'setTheme' && e.data.theme) {
            if (typeof ThemeManager !== 'undefined') {
                ThemeManager.setTheme(e.data.theme);
                updateCardTextColors(e.data.theme);
            }
        }
    });

    // 页面加载后更新激活状态
    function updateActiveCard() {
        var current = (ThemeManager && ThemeManager.currentTheme) || localStorage.getItem('theme') || 'original';
        document.querySelectorAll('[data-theme]').forEach(function(card) {
            if (card.getAttribute('data-theme') === current) {
                card.style.borderColor = '#667eea';
                card.style.boxShadow = '0 0 0 2px #667eea, 0 4px 15px rgba(0,0,0,0.2)';
            } else {
                card.style.borderColor = '#ddd';
                card.style.boxShadow = '';
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(updateActiveCard, 300); });
    } else {
        setTimeout(updateActiveCard, 300);
    }

    // 监听主题变化
    var _origSetTheme = null;
    function patchThemeManager() {
        // 无论 ThemeManager 是否存在，都应用当前主题颜色
        var currentTheme = localStorage.getItem('theme') || 'original';
        updateCardTextColors(currentTheme);
        updateActiveCard();

        if (typeof ThemeManager !== 'undefined' && !_origSetTheme) {
            _origSetTheme = ThemeManager.setTheme.bind(ThemeManager);
            ThemeManager.setTheme = function(name, save) {
                _origSetTheme(name, save);
                setTimeout(updateActiveCard, 100);
                updateCardTextColors(name);
            };
        }
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(patchThemeManager, 300); });
    } else {
        setTimeout(patchThemeManager, 300);
    }
</script>
{% endblock %}
