{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>文献管理</h1>
    <div class="header-actions">
    </div>
</div>

<!-- Search Bar -->
<div class="search-section">
    <div class="search-bar">
        <input type="text" id="search-input" placeholder="搜索文献标题、作者、关键词...">
        <button class="search-btn" onclick="performSearch()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            搜索
        </button>
    </div>
    <div class="filter-row">
        <select id="filter-year-from">
            <option value="">从年份</option>
            {% for year in range(2025, 1990, -1) %}
            <option value="{{ year }}">{{ year }}</option>
            {% endfor %}
        </select>
        <span class="filter-separator">-</span>
        <select id="filter-year-to">
            <option value="">到年份</option>
            {% for year in range(2025, 1990, -1) %}
            <option value="{{ year }}">{{ year }}</option>
            {% endfor %}
        </select>
        <select id="filter-status">
            <option value="">所有状态</option>
            <option value="uploaded">已上传</option>
            <option value="parsing">解析中</option>
            <option value="parsed">已解析</option>
            <option value="indexed">已索引</option>
            <option value="error">错误</option>
        </select>
        <label class="checkbox-label">
            <input type="checkbox" id="filter-has-structure"> 含结构信息
        </label>
        <button class="btn btn-small" onclick="clearFilters()">清除筛选</button>
    </div>
</div>

<!-- Tab Navigation -->
<div class="tabs-container">
    <div class="tabs">
        <button class="tab-btn active" data-tab="all" onclick="switchTab('all')">全部文献</button>
        <button class="tab-btn" data-tab="recent" onclick="switchTab('recent')">最近添加</button>
        <button class="tab-btn" data-tab="has-structure" onclick="switchTab('has-structure')">含结构信息</button>
    </div>
</div>

<!-- Literature Grid -->
<div class="literature-grid" id="literature-grid">
    <div class="loading-state" id="loading-state">
        <div class="spinner"></div>
        <p>加载中...</p>
    </div>
</div>

<!-- Pagination -->
<div class="pagination" id="pagination" style="display: none;">
    <button class="page-btn" id="prev-page" onclick="changePage(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        上一页
    </button>
    <span class="page-info" id="page-info">第 1 页 / 共 1 页</span>
    <button class="page-btn" id="next-page" onclick="changePage(1)">下一页
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/literature.js') }}"></script>
{% endblock %}
