{% extends "base.html" %}

{% block content %}
<div class="qa-page">
    <!-- Left Sidebar - Conversation History -->
    <div class="chat-sidebar" id="chat-sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewSession()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                新对话
            </button>
        </div>
        <div class="sidebar-conversations" id="chat-history-list">
            <!-- Conversation history will be loaded here -->
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">U</div>
                <div class="user-details">
                    <div class="name">用户</div>
                    <div class="email">user@example.com</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-main">
        <!-- Chat Header -->
        <header class="chat-header">
            <div class="chat-header-left">
                <button class="sidebar-toggle" onclick="toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1 class="chat-title">智能问答</h1>
            </div>
            <div class="chat-header-right">
                <button class="header-btn" onclick="clearChatHistory()" title="清除历史">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Messages Container -->
        <div class="chat-messages-container" id="chat-messages">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-icon">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                        <path d="M2 17l10 5 10-5"></path>
                        <path d="M2 12l10 5 10-5"></path>
                    </svg>
                </div>
                <h2 class="welcome-title">今天想聊些什么？</h2>
                <p class="welcome-subtitle">基于 AI 的 Cryo-EM 文献智能问答系统，我可以帮助你回答问题、查找文献。</p>
                <div class="welcome-prompts">
                    <button class="welcome-prompt" onclick="askQuestion('Vγ9Vδ2 TCR 的序列是什么？')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        Vγ9Vδ2 TCR 的序列
                    </button>
                    <button class="welcome-prompt" onclick="askQuestion('CRYO-EM 结构解析的最佳实践')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        CRYO-EM 最佳实践
                    </button>
                    <button class="welcome-prompt" onclick="askQuestion('EMDB 数据库的使用方法')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        EMDB 使用方法
                    </button>
                    <button class="welcome-prompt" onclick="askQuestion('如何提高冷冻电镜的分辨率？')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        提高分辨率技巧
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <div class="input-container">
                <textarea id="chat-input" placeholder="输入消息... (Shift+Enter 换行)" rows="1"></textarea>
                <div class="input-controls">
                    <div class="input-left">
                        <div class="model-select-wrapper">
                            <select id="model-select" onchange="onModelChange()">
                                <option value="">加载中...</option>
                            </select>
                        </div>
                        <button type="button" class="rag-btn active" id="rag-btn" onclick="toggleRag()">
                            RAG
                        </button>
                    </div>
                    <button type="button" class="send-btn" id="send-btn" onclick="sendChatMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="input-hint">AI 可能会出错。请核实重要信息。</p>
        </div>
    </div>

    <!-- Right Sidebar - Search Results -->
    <div class="chat-right-panel" id="side-panel">
        <div class="right-panel-header">
            <h3>搜索结果</h3>
        </div>
        <div class="search-results" id="search-results">
            <div class="empty-state">输入问题后显示相关文献</div>
        </div>
    </div>

    <!-- Toggle Button for History Drawer -->
    <button class="chat-history-toggle" id="chat-history-toggle" onclick="toggleChatHistory()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
    </button>

    <!-- Chat History Panel (Drawer) -->
    <div class="chat-history-overlay" id="chat-history-overlay" onclick="toggleChatHistory()"></div>
    <div class="chat-history-panel" id="chat-history-panel">
        <div class="chat-history-header">
            <h3>聊天历史</h3>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="new-chat-btn" onclick="startNewSession()" title="新建会话" style="width: auto; padding: 6px 12px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button onclick="toggleChatHistory()" style="background: none; border: none; cursor: pointer; padding: 4px; display: flex;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="chat-history-list" id="chat-history-list-drawer">
            <div class="history-empty">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4" style="margin-bottom: 12px;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <p>暂无历史记录</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Toggle chat history drawer
function toggleChatHistory() {
    const panel = document.getElementById('chat-history-panel');
    const overlay = document.getElementById('chat-history-overlay');
    panel.classList.toggle('open');
    overlay.classList.toggle('open');
}

// Toggle sidebar
function toggleSidebar() {
    const sidebar = document.getElementById('chat-sidebar');
    sidebar.classList.toggle('open');
}

// Current selected model
let currentModel = null;

// Initialize model info on page load
async function initModelInfo() {
    const modelSelect = document.getElementById('model-select');
    if (!modelSelect) return;

    modelSelect.innerHTML = '<option value="">加载中...</option>';

    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        const response = await fetch('/api/config/ai', {
            signal: controller.signal
        });
        clearTimeout(timeoutId);

        const data = await response.json();

        const models = data.models && data.models.length > 0 ? data.models : [];

        if (models.length === 0) {
            const option = document.createElement('option');
            option.value = data.active_model_id || 'default';
            option.textContent = data.chat_model || '默认模型';
            option.dataset.apiBase = data.api_base || '';
            option.dataset.apiKey = data.api_key || '';
            option.dataset.chatModel = data.chat_model || '';
            modelSelect.innerHTML = '';
            modelSelect.appendChild(option);
        } else {
            modelSelect.innerHTML = '';
            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model.id;
                option.textContent = model.name;
                option.dataset.apiBase = model.api_base || '';
                option.dataset.apiKey = model.api_key || '';
                option.dataset.chatModel = model.chat_model || '';
                modelSelect.appendChild(option);
            });

            if (data.active_model_id) {
                modelSelect.value = data.active_model_id;
            }
        }

        onModelChange();
    } catch (e) {
        console.error('Failed to load model info:', e);
        modelSelect.innerHTML = '';
        const option = document.createElement('option');
        option.value = 'default';
        option.textContent = '默认模型';
        option.dataset.apiBase = '';
        option.dataset.apiKey = '';
        option.dataset.chatModel = '';
        modelSelect.appendChild(option);
        onModelChange();
    }
}

function onModelChange() {
    const modelSelect = document.getElementById('model-select');
    if (!modelSelect || !modelSelect.selectedOptions[0]) return;

    const selectedOption = modelSelect.selectedOptions[0];
    currentModel = {
        id: modelSelect.value,
        name: selectedOption.textContent,
        api_base: selectedOption.dataset.apiBase,
        api_key: selectedOption.dataset.apiKey,
        chat_model: selectedOption.dataset.chatModel
    };
    console.log('Selected model:', currentModel);
}

initModelInfo();
</script>
<!-- Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="{{ url_for('static', filename='js/qa.js') }}"></script>
<script>
initPage();
</script>
{% endblock %}
