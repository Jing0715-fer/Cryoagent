<!-- Chat Message Component -->
<div class="message {% if is_user %}user{% else %}assistant{% endif %}">
    {% if not is_user %}
    <div class="message-avatar"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#icon-lightbulb"></use></svg></div>
    {% endif %}
    <div class="message-content">
        {% if is_user %}
        <div class="message-text">{{ message }}</div>
        {% else %}
        <div class="message-text">{{ message }}</div>
        {% if sources %}
        <div class="sources">
            <h5>参考来源：</h5>
            <ul>
                {% for source in sources %}
                <li>
                    <a href="{{ url_for('literature_detail', lit_id=source.id) }}" target="_blank">
                        {{ source.title[:50] }}...
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endif %}
    </div>
</div>
