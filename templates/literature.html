{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>文献列表</h1>
    <div class="header-actions">
        <button class="btn btn-primary" onclick="extractFullText()" title="从PDF提取完整文本用于RAG分块">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            提取全文
        </button>
        <button class="btn btn-secondary" onclick="rebuildIndex()" title="重建全文搜索索引">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            重建索引
        </button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">返回首页</a>
    </div>
</div>

<!-- Fulltext Extract Progress -->
<div id="fulltext-progress" class="card" style="display:none; margin: 10px 0;">
    <div class="card-content">
        <div class="progress-container">
            <div class="progress-header">
                <span id="fulltext-progress-stage">提取全文...</span>
                <span id="fulltext-progress-percent">0%</span>
            </div>
            <div class="progress-bar">
                <div id="fulltext-progress-fill" class="progress-fill" style="width: 0%;"></div>
            </div>
            <p id="fulltext-progress-message" class="progress-message">准备中...</p>
        </div>
    </div>
</div>

<!-- Search and Filter -->
<div class="search-section">
    <div class="search-bar">
        <input type="text" id="search-input" placeholder="搜索文献（支持标题、作者、期刊、PDB/EMDB ID）...">
        <button class="search-btn" onclick="searchLiterature()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </div>
    <!-- Filter Row -->
    <div class="filter-row">
        <span class="filter-label">年份筛选:</span>
        <input type="number" id="filter-year-from" placeholder="起始年份" style="width: 100px; padding: 8px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
        <span>-</span>
        <input type="number" id="filter-year-to" placeholder="结束年份" style="width: 100px; padding: 8px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
        <span class="filter-separator">|</span>
        <select id="filter-status" style="padding: 8px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
            <option value="">全部状态</option>
            <option value="uploaded">已上传</option>
            <option value="parsing">解析中</option>
            <option value="parsed">已解析</option>
            <option value="indexed">已索引</option>
            <option value="error">错误</option>
        </select>
        <span class="filter-separator">|</span>
        <label class="checkbox-label">
            <input type="checkbox" id="filter-has-structure">
            <span>仅显示含结构</span>
        </label>
        <button class="btn btn-secondary btn-small" onclick="clearFilters()" style="margin-left: auto;">清除筛选</button>
    </div>
</div>

<!-- Literature List -->
<div class="literature-list" id="literature-list">
    <div class="loading-state">
        <div class="spinner"></div>
        <p>加载中...</p>
    </div>
</div>

<div class="pagination" id="pagination">
    <button class="page-btn" onclick="changePage(-1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </button>
    <span class="page-info" id="page-info">1 / 1</span>
    <button class="page-btn" onclick="changePage(1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/literature.js') }}"></script>
{% endblock %}
